<!doctype html>
<html lang="pt-PT">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="apple-touch-icon" href="/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Google Search Console -->
		<meta name="google-site-verification" content="jnGYuVlQ48Nz7mqg12kxtlIm_bx7gW_TODmmE2oV9XU" />

		<!-- SEO básico -->
		<title>VGT Developments — Estúdio digital no Porto</title>
		<meta
			name="description"
			content="Estúdio digital no Porto. Criamos websites e plataformas web para empresas que valorizam execução. Do design ao deploy."
		/>
		<meta name="theme-color" content="#f3f1ec" />
		<link rel="canonical" href="https://www.vgtdevelopments.com/" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="pt_PT" />
		<meta property="og:site_name" content="VGT Developments" />
		<meta property="og:title" content="VGT Developments — Estúdio digital no Porto" />
		<meta
			property="og:description"
			content="Websites e plataformas web para empresas que valorizam execução. Sediados no Porto, a trabalhar remotamente."
		/>
		<meta property="og:image" content="https://www.vgtdevelopments.com/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:url" content="https://www.vgtdevelopments.com/" />

		<!-- Twitter / X -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="VGT Developments — Estúdio digital no Porto" />
		<meta
			name="twitter:description"
			content="Websites e plataformas web para empresas que valorizam execução."
		/>
		<meta name="twitter:image" content="https://www.vgtdevelopments.com/og-image.png" />

		<!-- Fontes -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>

		<!-- JSON-LD -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@graph": [
					{
						"@type": "WebSite",
						"name": "VGT Developments",
						"url": "https://www.vgtdevelopments.com/",
						"inLanguage": "pt-PT"
					},
					{
						"@type": "Organization",
						"name": "VGT Developments",
						"url": "https://www.vgtdevelopments.com/",
						"description": "Estúdio digital no Porto. Websites e plataformas web para empresas que valorizam execução.",
						"email": "vgtdevelopments@gmail.com",
						"logo": "https://www.vgtdevelopments.com/logo.png",
						"address": {
							"@type": "PostalAddress",
							"addressLocality": "Porto",
							"addressCountry": "PT"
						}
					}
				]
			}
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
